<title>Ediciones anteriores | El Puerto Hoy</title>
<meta name="description" content="Todas las ediciones del boletín diario de Puerto de la Cruz: noticias, agenda, el tiempo y farmacia de guardia.">
<link rel="canonical" href="https://boletin.elpuertohoy.com/ediciones.html">
<style>
  :root { --tinta:#0f1a26; --apagado:#5c6b7a; --azul:#1173d4; --fondo:#eef2f7; }
  body { margin:0; font:17px/1.55 -apple-system, system-ui, sans-serif; background:var(--fondo); color:var(--tinta); }
  .lienzo { max-width:640px; margin:0 auto; padding:16px 16px 40px; }
  img.cabecera { width:100%; border-radius:14px; box-shadow:0 4px 20px rgba(15,26,38,.15); display:block; }
  .fecha { text-align:center; color:var(--apagado); margin:14px 0 4px; }
  .fecha i { display:block; font-size:18px; font-weight:700; margin-bottom:2px; color:var(--azul); }
  .fecha .lema { display:block; font-size:15px; font-weight:700; margin-bottom:2px; }
  h2 { font-size:20px; margin:26px 0 4px; border-bottom:2px solid #d7dfe8; padding-bottom:6px; }
  .bloque { background:#fff; border-radius:12px; padding:14px 16px; margin:10px 0; box-shadow:0 1px 6px rgba(15,26,38,.07); overflow-wrap:break-word; }
  a { color:var(--azul); text-decoration:none; }
  a:visited { color:var(--azul); }
  .suscribir { margin-top:30px; text-align:center; }
  .suscribir p { color:var(--apagado); margin:0 0 14px; }
  a.boton { display:block; margin:10px 0; padding:14px; border-radius:12px; font-weight:700; color:#fff; }
  .tg { background:#1173d4; } .wa { background:#25d366; }
  /* Compartir va antes de suscribirse y con menos peso visual: la acción fuerte
     sigue siendo darse de alta en un canal. */
  .compartir { margin-top:34px; text-align:center; }
  button.boton-compartir { display:block; width:100%; margin:0 auto; padding:14px 16px;
    border-radius:12px; font:inherit; font-weight:700; line-height:1.35; cursor:pointer;
    background:#fff; color:var(--azul); border:2px solid var(--azul); }
  button.boton-compartir:active { transform:scale(.98); }
  .otros { margin-top:12px; font-size:15px; color:var(--apagado); }
  .otros a { margin:0 10px; font-weight:600; }
  .pie { text-align:center; margin-top:26px; font-size:19px; font-weight:700; }
  ul.ediciones { list-style:none; padding:0; }
  ul.ediciones li { background:#fff; border-radius:12px; margin:10px 0; box-shadow:0 1px 6px rgba(15,26,38,.07); }
  ul.ediciones a { display:block; padding:14px 16px; font-weight:700; }
</style>
</head>
